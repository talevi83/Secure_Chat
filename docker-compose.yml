version: '3.8'

services:
  chat-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: secure-chat-server
    ports:
      - "8888:8888"  # Chat server port
      - "8000:8000"  # API port
    networks:
      - encriptochat-network
    volumes:
      - ./server/users.db:/app/users.db  # Persist user database

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    container_name: secure-chat-monitor
    ports:
      - "8080:8080"  # Web monitoring interface
    depends_on:
      - chat-server
    environment:
      - API_BASE_URL=http://chat-server:8000  # Use Docker service name
    networks:
      - encriptochat-network
    restart: unless-stopped  # Add restart policy

networks:
  encriptochat-network:
    name: encriptochat-network
    driver: bridge